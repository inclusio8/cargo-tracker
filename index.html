<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관세청 UNIPASS 수입화물진행정보</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader {
      width: 100%;
      background-color: #000;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover !important;
      display: block !important;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10">

  <!-- 관세청 모바일 헤더 -->
  <header class="bg-[#003366] text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="bg-white text-[#003366] font-extrabold text-xs px-2 py-1 rounded">UNIPASS</div>
      <h1 class="font-bold text-base tracking-tight">수입화물진행정보</h1>
    </div>
    <span class="text-xs bg-blue-800 px-2 py-0.5 rounded">관세청</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-x-0 space-y-4">

    <!-- 바코드 스캐너 카드 -->
    <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-200">
      <h2 class="text-sm font-bold text-gray-700 mb-2 flex items-center">
        <svg class="w-4 h-4 mr-1 text-[#003366]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        카메라 바코드/QR 스캔
      </h2>

      <!-- 카메라 출력 구역 -->
      <div id="reader" class="mb-3"></div>

      <div class="flex gap-2">
        <button id="start-btn" onclick="startScanner()" class="flex-1 bg-[#003366] hover:bg-[#002244] text-white py-2.5 rounded text-sm font-bold shadow transition">
          카메라 켜기
        </button>
        <button id="stop-btn" onclick="stopScanner()" class="hidden flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2.5 rounded text-sm font-bold shadow transition">
          카메라 끄기
        </button>
      </div>
      <p id="camera-status" class="text-xs text-gray-500 mt-2 text-center">버튼을 누르면 카메라 스캐너가 시작됩니다.</p>
    </div>

    <!-- B/L 번호 직접 입력 -->
    <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-200">
      <label class="block text-sm font-bold text-gray-700 mb-1">House B/L (화물관리번호)</label>
      <div class="flex gap-2">
        <input type="text" id="bl-input" placeholder="B/L 번호 입력 (예: HBL12345678)" class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#003366]">
        <button onclick="searchBL()" class="bg-[#003366] text-white px-4 py-2 rounded text-sm font-bold hover:bg-[#002244]">조회</button>
      </div>
    </div>

    <!-- 조회 결과 및 관세청 직접 연결 -->
    <div id="result-card" class="hidden bg-white rounded-lg p-4 shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <span class="text-xs font-bold text-[#003366]">조회된 House B/L</span>
        <span id="result-bl-no" class="text-sm font-extrabold text-gray-900"></span>
      </div>

      <!-- 관세청 유니패스 직접 조회 링크 (실제 정보 확인용) -->
      <a id="unipass-direct-link" href="#" target="_blank" class="block w-full text-center bg-blue-50 text-[#003366] border border-blue-200 py-2.5 rounded text-xs font-bold hover:bg-blue-100">
        🔗 관세청 UNIPASS 공식 사이트에서 실시간 진행 확인하기
      </a>

      <!-- 시뮬레이션 타임라인 -->
      <div class="border-t pt-3">
        <p class="text-xs font-bold text-gray-600 mb-2">통관 진행 시뮬레이션 단계</p>
        <div class="space-y-2 text-xs">
          <div class="flex items-center text-green-600 font-bold">
            <span class="w-2 h-2 rounded-full bg-green-600 mr-2"></span> [1] 입항보고 완료 (인천공항)
          </div>
          <div class="flex items-center text-green-600 font-bold">
            <span class="w-2 h-2 rounded-full bg-green-600 mr-2"></span> [2] 보세구역 반입 완료
          </div>
          <div class="flex items-center text-blue-600 font-bold">
            <span class="w-2 h-2 rounded-full bg-blue-600 mr-2"></span> [3] 수입 신고 심사 중 (진행중)
          </div>
          <div class="flex items-center text-gray-400">
            <span class="w-2 h-2 rounded-full bg-gray-300 mr-2"></span> [4] 물품 반출 및 국내 배송
          </div>
        </div>
      </div>
    </div>

    <!-- 최근 조회 기록 -->
    <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-sm font-bold text-gray-700">최근 조회 기록</h3>
        <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">기록 삭제</button>
      </div>
      <ul id="history-list" class="divide-y divide-gray-100 text-xs text-gray-600">
        <li class="py-2 text-center text-gray-400">최근 조회된 기록이 없습니다.</li>
      </ul>
    </div>

  </main>

  <script>
    let html5QrcodeScanner = null;

    // 스캐너 시작
    function startScanner() {
      const statusText = document.getElementById('camera-status');
      statusText.innerText = '카메라 연결 중...';

      html5QrcodeScanner = new Html5Qrcode("reader");

      // 안드로이드 Chrome 기본 카메라 백엔드 설정
      const config = { fps: 10, qrbox: { width: 250, height: 150 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
          // 스캔 성공 시
          document.getElementById('bl-input').value = decodedText;
          stopScanner();
          searchBL(decodedText);
        },
        (errorMessage) => {
          // 스캔 진행 중 (무시)
        }
      ).then(() => {
        document.getElementById('start-btn').classList.add('hidden');
        document.getElementById('stop-btn').classList.remove('hidden');
        statusText.innerText = '바코드/QR코드를 화면 중앙에 맞춰주세요.';
      }).catch((err) => {
        statusText.innerText = '카메라를 열 수 없습니다. 권한 상태 및 다른 앱에서 카메라 사용 중인지 확인해주세요.';
        console.error(err);
      });
    }

    // 스캐너 중지
    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('start-btn').classList.remove('hidden');
          document.getElementById('stop-btn').classList.add('hidden');
          document.getElementById('camera-status').innerText = '카메라가 꺼졌습니다.';
        }).catch(err => console.error(err));
      }
    }

    // B/L 조회 처리
    function searchBL(scannedBL = null) {
      const blNo = scannedBL || document.getElementById('bl-input').value.trim();
      if (!blNo) {
        alert('B/L 번호를 입력하거나 스캔해주세요.');
        return;
      }

      // 결과 카드 보이기
      document.getElementById('result-card').classList.remove('hidden');
      document.getElementById('result-bl-no').innerText = blNo;

      // 관세청 UNIPASS 화물진행정보 직접 이동 링크 생성
      const unipassUrl = `https://unipass.customs.go.kr/csp/index.do?searchHblNo=${encodeURIComponent(blNo)}`;
      document.getElementById('unipass-direct-link').href = unipassUrl;

      // 기록 저장
      saveHistory(blNo);
    }

    // 로컬스토리지 기록 저장
    function saveHistory(blNo) {
      let history = JSON.parse(localStorage.getItem('bl_history') || '[]');
      history = history.filter(item => item.bl !== blNo);
      history.unshift({ bl: blNo, date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) });
      if (history.length > 5) history.pop();
      localStorage.setItem('bl_history', JSON.stringify(history));
      renderHistory();
    }

    // 기록 화면 출력
    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('bl_history') || '[]');
      const listEl = document.getElementById('history-list');

      if (history.length === 0) {
        listEl.innerHTML = '<li class="py-2 text-center text-gray-400">최근 조회된 기록이 없습니다.</li>';
        return;
      }

      listEl.innerHTML = history.map(item => `
        <li class="py-2 flex justify-between items-center cursor-pointer hover:bg-gray-50 px-1" onclick="document.getElementById('bl-input').value='${item.bl}'; searchBL();">
          <span class="font-bold text-gray-800">${item.bl}</span>
          <span class="text-gray-400 text-[10px]">${item.date}</span>
        </li>
      `).join('');
    }

    // 기록 삭제
    function clearHistory() {
      localStorage.removeItem('bl_history');
      renderHistory();
    }

    // 페이지 로드시 기록 초기화
    window.onload = renderHistory;
  </script>
</body>
</html>
